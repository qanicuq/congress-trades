name: Test Ping

on:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send test ping
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s -H "Title: Congress tracker test ping OK" \
            -d "Congress tracker test ping OK" \
            "https://ntfy.sh/${NTFY_TOPIC}"
